<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#5c94fc">
<title>Aventura de Kiko</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    font-family: 'Courier New', monospace;
    background: #5c94fc;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
    user-select: none;
  }

  h1 {
    margin: 12px 0 6px;
    font-size: clamp(20px, 5vw, 32px);
    text-shadow: 3px 3px 0 #b03a2e;
    letter-spacing: 1px;
  }

  #hud {
    display: flex;
    gap: 24px;
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 8px;
    text-shadow: 2px 2px 0 #00000055;
  }

  #wrap {
    position: relative;
    width: min(900px, 96vw);
    aspect-ratio: 16 / 9;
    border: 4px solid #2b2b2b;
    border-radius: 6px;
    overflow: hidden;
    background: linear-gradient(#5c94fc 0%, #8fc7ff 70%, #a0e6a0 70%, #6bbf59 100%);
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  #overlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: #000000aa;
    text-align: center;
    padding: 20px;
  }

  #overlay.show { display: flex; }

  #overlay h2 {
    font-size: clamp(22px, 6vw, 34px);
    margin-bottom: 10px;
    text-shadow: 3px 3px 0 #b03a2e;
  }

  #overlay button {
    margin-top: 14px;
    padding: 12px 26px;
    font-size: 16px;
    font-weight: bold;
    font-family: inherit;
    background: #ffcd3c;
    color: #2b2b2b;
    border: 3px solid #2b2b2b;
    border-radius: 8px;
    cursor: pointer;
  }

  #overlay button:active { transform: scale(.96); }

  #controls {
    display: flex;
    justify-content: space-between;
    width: min(900px, 96vw);
    margin-top: 14px;
  }

  .pad {
    display: flex;
    gap: 10px;
  }

  .btn {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 3px solid #2b2b2b;
    background: #f4f1ea;
    color: #2b2b2b;
    font-size: 26px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
  }

  .btn:active, .btn.active {
    background: #ffcd3c;
    transform: scale(.94);
  }

  #jumpBtn {
    width: 84px;
    height: 84px;
    background: #e74c3c;
    color: white;
    border-color: #7a1f16;
  }

  #jumpBtn:active, #jumpBtn.active {
    background: #ff6f5c;
  }

  footer {
    margin-top: 10px;
    opacity: .7;
    font-size: 12px;
    text-align: center;
    padding-bottom: 10px;
  }
</style>
</head>
<body>

<h1>🍄 Aventura de Kiko</h1>

<div id="hud">
  <span>⭐ Monedas: <span id="coinCount">0</span>/<span id="coinTotal">0</span></span>
  <span>❤️ Vidas: <span id="lives">3</span></span>
</div>

<div id="wrap">
  <canvas id="game"></canvas>

  <div id="overlay">
    <h2 id="overlayTitle">¡Listo para saltar!</h2>
    <p id="overlayText">Recoge todas las monedas y llega a la bandera. Cuidado con el enemigo.</p>
    <button id="overlayBtn">Jugar</button>
  </div>
</div>

<div id="controls">
  <div class="pad">
    <div class="btn" id="leftBtn">◀</div>
    <div class="btn" id="rightBtn">▶</div>
  </div>
  <div class="btn" id="jumpBtn">↑</div>
</div>

<footer>Flechas o botones táctiles para moverte. Barra espaciadora o el botón rojo para saltar.</footer>

<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const overlayBtn = document.getElementById('overlayBtn');
  const coinCountEl = document.getElementById('coinCount');
  const coinTotalEl = document.getElementById('coinTotal');
  const livesEl = document.getElementById('lives');

  const W = 900, H = 506;
  canvas.width = W;
  canvas.height = H;

  const GRAVITY = 0.55;
  const GROUND_Y = H - 60;

  const keys = { left: false, right: false, jump: false };

  let state = 'ready';

  const player = {
    x: 40, y: 0, w: 34, h: 40,
    vx: 0, vy: 0,
    onGround: false,
    facing: 1
  };

  let lives = 3;
  let coins = 0;

  function resetPlayer() {
    player.x = 40;
    player.y = GROUND_Y - player.h;
    player.vx = 0;
    player.vy = 0;
  }

  const platforms = [
    { x: 0, y: GROUND_Y, w: 260, h: 60 },
    { x: 320, y: GROUND_Y, w: 160, h: 60 },
    { x: 540, y: GROUND_Y, w: 360, h: 60 },
    { x: 260, y: GROUND_Y - 90, w: 100, h: 20 },
    { x: 460, y: GROUND_Y - 150, w: 100, h: 20 },
    { x: 660, y: GROUND_Y - 110, w: 120, h: 20 }
  ];

  const coinDefs = [
    { x: 300, y: GROUND_Y - 130 },
    { x: 500, y: GROUND_Y - 190 },
    { x: 700, y: GROUND_Y - 150 },
    { x: 600, y: GROUND_Y - 30 },
    { x: 800, y: GROUND_Y - 30 }
  ];
  let coinList = [];

  function resetCoins() {
    coinList = coinDefs.map(c => ({ ...c, taken: false }));
    coinTotalEl.textContent = coinList.length;
  }

  const enemy = {
    x: 700, y: GROUND_Y - 34, w: 34, h: 34,
    vx: 1.6, min: 560, max: 860, alive: true
  };

  function resetEnemy() {
    enemy.x = 700;
    enemy.vx = 1.6;
    enemy.alive = true;
  }

  const flag = { x: 850, y: GROUND_Y - 120, w: 12, h: 120 };

  function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x &&
           a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function startGame() {
    lives = 3;
    coins = 0;
    livesEl.textContent = lives;
    coinCountEl.textContent = coins;
    resetPlayer();
    resetCoins();
    resetEnemy();
    state = 'playing';
    overlay.classList.remove('show');
  }

  function loseLife() {
    lives--;
    livesEl.textContent = lives;
    if (lives <= 0) {
      state = 'dead';
      overlayTitle.textContent = '💥 ¡Kiko se quedó sin vidas!';
      overlayText.textContent = 'Inténtalo de nuevo, tú puedes lograrlo.';
      overlayBtn.textContent = 'Reintentar';
      overlay.classList.add('show');
    } else {
      resetPlayer();
    }
  }

  function winGame() {
    state = 'win';
    overlayTitle.textContent = '🏆 ¡Nivel completado!';
    overlayText.textContent = `Recogiste ${coins} de ${coinList.length} monedas.`;
    overlayBtn.textContent = 'Jugar otra vez';
    overlay.classList.add('show');
  }

  function update() {
    if (state !== 'playing') return;

    const SPEED = 3.6;
    if (keys.left) { player.vx = -SPEED; player.facing = -1; }
    else if (keys.right) { player.vx = SPEED; player.facing = 1; }
    else { player.vx = 0; }

    player.x += player.vx;
    player.x = Math.max(0, Math.min(W - player.w, player.x));

    if (keys.jump && player.onGround) {
      player.vy = -11.5;
      player.onGround = false;
    }

    player.vy += GRAVITY;
    player.y += player.vy;

    player.onGround = false;
    for (const p of platforms) {
      const prevBottom = player.y + player.h - player.vy;
      const nowBottom = player.y + player.h;
      if (
        player.x + player.w > p.x && player.x < p.x + p.w &&
        prevBottom <= p.y && nowBottom >= p.y && player.vy >= 0
      ) {
        player.y = p.y - player.h;
        player.vy = 0;
        player.onGround = true;
      }
    }

    if (player.y > H + 60) {
      loseLife();
      return;
    }

    if (enemy.alive) {
      enemy.x += enemy.vx;
      if (enemy.x < enemy.min || enemy.x > enemy.max) enemy.vx *= -1;
    }

    if (enemy.alive && rectsOverlap(player, enemy)) {
      const stomping = player.vy > 0 && (player.y + player.h) - enemy.y < 18;
      if (stomping) {
        enemy.alive = false;
        player.vy = -8;
      } else {
        loseLife();
        return;
      }
    }

    for (const c of coinList) {
      if (c.taken) continue;
      const cb = { x: c.x - 10, y: c.y - 10, w: 20, h: 20 };
      if (rectsOverlap(player, cb)) {
        c.taken = true;
        coins++;
        coinCountEl.textContent = coins;
      }
    }

    if (rectsOverlap(player, flag)) {
      winGame();
    }
  }

  function drawBackground() {
    ctx.fillStyle = '#ffffffcc';
    drawCloud(120, 70);
    drawCloud(420, 50);
    drawCloud(700, 90);
  }

  function drawCloud(x, y) {
    ctx.beginPath();
    ctx.arc(x, y, 18, 0, Math.PI * 2);
    ctx.arc(x + 20, y - 8, 20, 0, Math.PI * 2);
    ctx.arc(x + 42, y, 18, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawPlatforms() {
    for (const p of platforms) {
      ctx.fillStyle = '#8b5a2b';
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = '#6bbf59';
      ctx.fillRect(p.x, p.y, p.w, 10);
    }
  }

  function drawCoins() {
    for (const c of coinList) {
      if (c.taken) continue;
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.fillStyle = '#ffd447';
      ctx.strokeStyle = '#b8860b';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawEnemy() {
    if (!enemy.alive) return;
    ctx.save();
    ctx.translate(enemy.x, enemy.y);
    ctx.fillStyle = '#7b3fa0';
    ctx.beginPath();
    ctx.arc(enemy.w / 2, enemy.h / 2, enemy.w / 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(enemy.w / 2 - 7, enemy.h / 2 - 4, 5, 0, Math.PI * 2);
    ctx.arc(enemy.w / 2 + 7, enemy.h / 2 - 4, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(enemy.w / 2 - 7, enemy.h / 2 - 4, 2, 0, Math.PI * 2);
    ctx.arc(enemy.w / 2 + 7, enemy.h / 2 - 4, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawFlag() {
    ctx.fillStyle = '#c9c9c9';
    ctx.fillRect(flag.x, flag.y, 4, flag.h);
    ctx.fillStyle = '#e74c3c';
    ctx.beginPath();
    ctx.moveTo(flag.x + 4, flag.y);
    ctx.lineTo(flag.x + 34, flag.y + 12);
    ctx.lineTo(flag.x + 4, flag.y + 24);
    ctx.closePath();
    ctx.fill();
  }

  function drawPlayer() {
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.fillStyle = '#e74c3c';
    ctx.fillRect(0, 14, player.w, player.h - 14);
    ctx.fillStyle = '#ffd7b3';
    ctx.fillRect(4, 0, player.w - 8, 16);
    ctx.fillStyle = '#c0392b';
    ctx.fillRect(0, -4, player.w, 8);
    ctx.fillStyle = '#000';
    const eyeX = player.facing === 1 ? player.w - 12 : 6;
    ctx.fillRect(eyeX, 6, 4, 4);
    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawBackground();
    drawPlatforms();
    drawCoins();
    drawFlag();
    drawEnemy();
    drawPlayer();
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  window.addEventListener('keydown', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { keys.jump = true; e.preventDefault(); }
  });
  window.addEventListener('keyup', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') keys.jump = false;
  });

  function bindHold(el, onDown, onUp) {
    el.addEventListener('touchstart', e => { e.preventDefault(); el.classList.add('active'); onDown(); }, { passive: false });
    el.addEventListener('touchend', e => { e.preventDefault(); el.classList.remove('active'); onUp(); }, { passive: false });
    el.addEventListener('mousedown', () => { el.classList.add('active'); onDown(); });
    el.addEventListener('mouseup', () => { el.classList.remove('active'); onUp(); });
    el.addEventListener('mouseleave', () => { el.classList.remove('active'); onUp(); });
  }

  bindHold(document.getElementById('leftBtn'), () => keys.left = true, () => keys.left = false);
  bindHold(document.getElementById('rightBtn'), () => keys.right = true, () => keys.right = false);
  bindHold(document.getElementById('jumpBtn'), () => keys.jump = true, () => keys.jump = false);

  overlayBtn.addEventListener('click', startGame);

  resetPlayer();
  resetCoins();
  overlay.classList.add('show');
  draw();
  loop();
})();
</script>

</body>
</html>

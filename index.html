<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#24124d">
  <title>El Mago Lector</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="game">

  <header>
    <div>
      <h1>🧙‍♂️ El Mago Lector</h1>
      <p>Lee en voz alta y transforma monstruos en conejitos.</p>
    </div>

    <div class="stars">
      ⭐ <span id="stars">0</span>
    </div>
  </header>

  <section class="world">

    <div class="character">🧙‍♂️</div>

    <div class="monster" id="monster">👹</div>

    <div class="wand">🪄</div>

  </section>

  <section class="card">

    <div class="level">
      Nivel <span id="level">1</span>
    </div>

    <h2 id="title">
      Las sílabas mágicas
    </h2>

    <p id="instruction">
      Di en voz alta:
    </p>

    <div class="word" id="word">
      TA • TE • TI • TO • TU
    </div>

    <button id="listenBtn">
      🎤 Mantén presionado y lee
    </button>

    <button class="secondary" id="repeatBtn">
      🔊 Escuchar ejemplo
    </button>

    <div id="result" class="result">
      Preparado para la magia ✨
    </div>

    <div class="progress">
      <div id="progressBar"></div>
    </div>

  </section>

  <section class="spellbook">

    <h3>📖 Palabras de esta aventura</h3>

    <div id="wordList"></div>

  </section>

</main>

<script src="game.js"></script>

</body>
</html>
